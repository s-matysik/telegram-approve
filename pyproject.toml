[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-approve"
version = "0.1.0"
description = "Human-in-the-loop approvals for AI agents via Telegram, bound to exact content and executed at most once."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sebastian Matysik" }]
keywords = ["telegram", "approval", "human-in-the-loop", "ai-agents", "audit"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Framework :: AsyncIO",
]
dependencies = ["python-telegram-bot>=21"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_approve"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
